<div class="cart-widget collapsed" id="cartWidget">
    <div class="cart-header">
        <span>Selected Games (<span id="cartCount">0</span>)</span>
        <div class="cart-header-actions">
            <button class="btn-clear-all" id="btnClearAll">Clear All</button>
            <button class="cart-toggle-btn" id="btnCartToggle"><i class="fa-solid fa-chevron-down"></i></button>
        </div>
    </div>
    <div class="cart-collapsible-content">
        <ul class="cart-items" id="cartList">
            <li class="empty-msg">No games selected yet</li>
        </ul>
        <div class="hdd-storage-section">
            <div class="hdd-label-row">
                <div class="hdd-info-group">
                    <i class="fa-solid fa-hard-drive hdd-icon"></i>
                    <span>Storage Used: <span class="hdd-val-highlight" id="totalSize">0.00 GB</span></span>
                </div>
                <select class="target-drive-select" id="driveSelect">
                    <option value="128">Target: 128 GB Drive</option>
                    <option value="256">Target: 256 GB Drive</option>
                    <option value="512" selected>Target: 512 GB Drive</option>
                    <option value="1024">Target: 1 TB Drive</option>
                    <option value="2048">Target: 2 TB Drive</option>
                </select>
            </div>
            <div class="tetris-bar-bg" id="tetrisBar"></div>
            <div class="storage-advice-box" id="storageAdvice">
                <i class="fa-solid fa-lightbulb"></i>
                <span id="adviceText">Select games to see storage distribution.</span>
            </div>
        </div>
        <div class="cart-footer">
            <button class="btn-copy-drawer" id="btnCopy" disabled><i class="fa-solid fa-copy"></i> Copy Selection List</button>
        </div>
    </div>
</div>
