<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offgrid Gaming | Instant. Offline. Play.</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0a10;
            --bg-card: #161220;
            --bg-card-hover: #1f1a2e;
            --accent-orange: #ff6a00;
            --accent-purple: #9d4edd;
            --accent-purple-glow: #7b2cbf;
            --accent-purple-light: #c77dff;
            --accent-green: #00e676;
            --accent-blue: #00b4d8;
            --accent-yellow: #ffd166;
            --accent-red: #ff3366;
            --border-color: #2e2440;
            --text-main: #f3effa;
            --text-muted: #9a8cae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(157, 78, 221, 0.18) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 220px;
        }

        header {
            text-align: center;
            padding: 20px 15px 10px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(11,10,16,0.95) 0%, rgba(11,10,16,0.85) 100%);
        }

        .site-logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 18px rgba(157, 78, 221, 0.5));
        }

        /* --- CONTROL PANEL --- */
        .controls {
            max-width: 1100px;
            margin: 15px auto 10px;
            padding: 0 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-sort-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.35);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .sort-dropdown {
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-dropdown:focus {
            border-color: var(--accent-purple);
        }

        .genre-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .genre-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .chip:hover, .chip.active {
            background: rgba(157, 78, 221, 0.2);
            color: var(--accent-purple-light);
            border-color: var(--accent-purple);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 5px 15px 20px;
            flex: 1;
            width: 100%;
        }

        /* IFRAME EMBED SYSTEM */
        .gamelist-frame {
            width: 100%;
            border: none;
            min-height: 800px;
            background: transparent;
        }

        /* --- FLOATING WINDOW SYSTEM REQUIREMENTS --- */
        .modal-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: var(--bg-card);
            border: 1px solid var(--accent-purple);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(157, 78, 221, 0.25);
            border-radius: 12px;
            width: 90%;
            max-width: 440px;
            padding: 22px;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-container.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-title i {
            color: var(--accent-orange);
        }

        .btn-close-modal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-close-modal:hover {
            color: #fff;
            border-color: var(--accent-orange);
            background: var(--accent-orange);
        }

        /* --- SIDEBAR / DRAWER --- */
        .cart-widget {
            position: fixed;
            bottom: 10px;
            right: 10px;
            left: 10px;
            max-width: none;
            background: var(--bg-card);
            border: 1px solid var(--accent-purple);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 20px rgba(157, 78, 221, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {
            .cart-widget {
                left: auto;
                bottom: 20px;
                right: 20px;
                width: 400px;
                max-width: calc(100vw - 40px);
            }
        }

        .cart-widget.collapsed .cart-collapsible-content {
            display: none;
        }

        .cart-header {
            background: rgba(157, 78, 221, 0.15);
            padding: 10px 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--accent-purple-light);
        }

        @media (min-width: 768px) {
            .cart-header {
                padding: 12px 15px;
                font-size: 0.95rem;
            }
        }

        .cart-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-toggle-btn {
            background: none;
            border: none;
            color: var(--accent-purple-light);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            transition: transform 0.2s;
        }

        .cart-widget.collapsed .cart-toggle-btn i {
            transform: rotate(180deg);
        }

        .btn-clear-all {
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-clear-all:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .cart-collapsible-content {
            display: flex;
            flex-direction: column;
            max-height: 50vh;
            overflow-y: auto;
        }

        .cart-items {
            list-style: none;
            padding: 8px 10px;
            overflow-y: auto;
            max-height: 120px;
            flex: 1;
        }

        .cart-footer {
            padding: 10px 12px;
            background: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        .btn-copy-drawer {
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-orange) 100%);
            color: #fff;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .toast-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <header>
        <img src="logo.png" alt="Offgrid Gaming Logo" class="site-logo">
    </header>

    <div class="controls">
        <div class="filter-sort-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search games...">
            </div>
            <select class="sort-dropdown" id="sortSelect">
                <option value="name-asc">Sort: A to Z</option>
                <option value="size-asc">Sort: Size (Smallest)</option>
                <option value="size-desc">Sort: Size (Largest)</option>
            </select>
        </div>

        <div class="genre-chips" id="genreChips">
            <button class="chip active" data-genre="all">All Games</button>
            <button class="chip" data-genre="RPG">RPG</button>
            <button class="chip" data-genre="Open World">Open World</button>
            <button class="chip" data-genre="Souls-like">Souls-like</button>
            <button class="chip" data-genre="Racing">Racing</button>
            <button class="chip" data-genre="Sports">Sports</button>
            <button class="chip" data-genre="Action-Adventure">Action-Adventure</button>
            <button class="chip" data-genre="Strategy">Strategy</button>
            <button class="chip" data-genre="Simulation">Simulation</button>
        </div>
    </div>

    <main class="container">
        <!-- LINK TO GAMELIST.HTML -->
        <iframe src="gamelist.html" class="gamelist-frame" id="gamelistFrame" title="Game List"></iframe>
    </main>

    <script>
        // Adjust iframe height dynamically based on content inside gamelist.html
        window.addEventListener('message', function(e) {
            if (e.data && e.data.height) {
                document.getElementById('gamelistFrame').style.height = e.data.height + 'px';
            }
        });
    </script>
</body>
</html>
